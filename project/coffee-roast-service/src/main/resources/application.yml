server:
  port: 8081

application:
  kafka:
    topic-request: "roast-request"
    topic-response: "roast-response"

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/roastDB
    username: usr
    password: pwd
  flyway:
    enabled: true
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  kafka:
    producer:
      bootstrap-servers: "localhost:9092"
      client-id: "roast-producer"
    consumer:
      group-id: "roast-group"
      bootstrap-servers: "localhost:9092"
      client-id: "roast-consumer"
      auto-offset-reset: earliest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO
