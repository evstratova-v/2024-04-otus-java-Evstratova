server:
  port: 8080

application:
  kafka:
    topic-request: "roast-request"
    topic-response: "roast-response"
  coffee-service:
    enable-scheduling: true
    scheduling-fixed-rate: 20000

spring:
  datasource:
    url: jdbc:postgresql://localhost:5431/orderDB
    username: usr
    password: pwd
  flyway:
    enabled: true
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  kafka:
    producer:
      bootstrap-servers: "localhost:9092"
      client-id: "order-producer"
    consumer:
      group-id: "order-group"
      bootstrap-servers: "localhost:9092"
      client-id: "order-consumer"
      auto-offset-reset: earliest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO
